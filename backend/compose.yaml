# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  nomnom-db:
    image: mysql:9.4.0
    environment:
      MYSQL_DATABASE: ${NOMNOM_MYSQL_PROD_DATABASE}
      MYSQL_USER: ${NOMNOM_MYSQL_USER}
      MYSQL_ROOT_PASSWORD: ${NOMNOM_MYSQL_DEV_ROOT_PASSWORD}
      PORT: ${PORT}
    ports:
      - 3306:3306
    volumes:
      - mysql_data:/var/lib/mysql

  nomnom-api:
    build:
      context: .
      target: prod
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      MYSQL_ROOT_PASSWORD: ${NOMNOM_MYSQL_PROD_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOMNOM_MYSQL_PROD_DATABASE}
      MYSQL_PORT: ${NOMNOM_MYSQL_PORT}
      MYSQL_HOST: nomnom-db
      MYSQL_USER: ${NOMNOM_MYSQL_USER}
    ports:
      - 5000:5000
    volumes:
      - ./src:/usr/src/app/src
      - ./public:/usr/src/app/public
    command: npm run start
    depends_on:
      - nomnom-db

volumes:
  mysql_data:

